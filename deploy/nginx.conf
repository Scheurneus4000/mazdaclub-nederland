# Alternatief voor Caddy: Nginx als reverse proxy (bijv. met PM2 of systemd zonder Docker).
# Certificaat aanvragen met: sudo certbot --nginx -d mazdaclub.nl -d www.mazdaclub.nl

server {
    listen 80;
    server_name mazdaclub.nl www.mazdaclub.nl;
    return 301 https://mazdaclub.nl$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mazdaclub.nl;

    ssl_certificate     /etc/letsencrypt/live/mazdaclub.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mazdaclub.nl/privkey.pem;

    client_max_body_size 16m;   # foto-uploads
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
