# Stelt wekelijks updates voor (als pull request). Beveiligingsupdates komen direct.
# Vercel bouwt voor elk voorstel een testversie (preview), zodat je kunt controleren voordat je samenvoegt.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      kleine-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
